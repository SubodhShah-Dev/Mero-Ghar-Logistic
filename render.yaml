services:
  # Backend API (Express + Node, free tier)
  - type: web
    name: meroghar-backend
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: mysql
      # Seeds demo accounts (admin/vendor/customer @test.com) on first deploy so
      # an admin can log in. Set to "false" once real users exist.
      - key: SEED_DEMO_DATA
        value: "true"
      # TiDB Cloud Serverless (MySQL-compatible) uses TLS on port 4000.
      - key: MYSQL_SSL
        value: "true"
      - key: MYSQLPORT
        value: "4000"
      # Fill these in the Render dashboard after creating the TiDB cluster.
      - key: MYSQLHOST
        value: set-this-in-dashboard
      - key: MYSQLUSER
        value: set-this-in-dashboard
      - key: MYSQL_DATABASE
        value: set-this-in-dashboard
      - key: MYSQLPASSWORD
        generateValue: true
      # TiDB Starter CA cert as base64 (from the TiDB console connection dialog).
      - key: MYSQL_SSL_CA_B64
        value: set-this-in-dashboard
      - key: JWT_SECRET
        generateValue: true

  # Web frontend (Vite static SPA, free tier)
  - type: web
    name: meroghar-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback so deep links (/login, /book, /admin, ...) serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://meroghar-backend.onrender.com
