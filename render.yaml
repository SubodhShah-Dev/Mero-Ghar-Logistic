services:
  # Backend API (Express + Node, free tier) - uses SQLite, no external DB needed.
  - type: web
    name: meroghar-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # SQLite only - zero cost, no external database account required.
      # Note: Render's free-tier disk is ephemeral; the SQLite file resets on
      # redeploy. Demo seeding (below) refills it, which is fine for a showcase.
      - key: DB_DRIVER
        value: sqlite
      # Seeds demo accounts (admin/vendor/customer @test.com) on first deploy so
      # an admin can log in. Set to "false" once real users exist.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: JWT_SECRET
        generateValue: true

  # Web frontend (Vite static SPA, free tier)
  - type: web
    name: meroghar-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback so deep links (/login, /book, /admin, ...) serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://meroghar-backend.onrender.com
